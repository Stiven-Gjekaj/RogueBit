name: ci

# The core is tested. The frontend is compiled but not run.
#
# SadConsole opens a real window through MonoGame, so the frontend cannot
# execute on a runner with no display. Saying "tested" of a job that only
# compiles would be a claim this workflow does not support, so the two jobs are
# named for what they actually do.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  test:
    name: test the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Check the formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test tests/RogueBit.Core.Tests/RogueBit.Core.Tests.csproj --no-restore --verbosity normal

  compile:
    name: compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build the whole solution
        run: dotnet build --configuration Release
