version: 2

# Every label named below has to exist in the repository before Dependabot can
# use it. Left to itself Dependabot makes its own label, but a label it is told
# to use and cannot find stops it labelling anything, and it says so in a
# comment on the pull request rather than carrying on.

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      # The test tooling moves together and is checked by running the suite, so
      # one pull request for the lot of it is enough.
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"

    # SadConsole and MonoGame are deliberately left ungrouped. They are what the
    # game draws with, the host package binds to one exact MonoGame version, and
    # a mismatch there already shipped a release that could not start. Those
    # arrive one at a time so each gets looked at on its own.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
